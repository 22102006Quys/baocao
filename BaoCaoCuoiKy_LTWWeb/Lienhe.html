<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Liên hệ - Nhịp Store</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Serif:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="site-header"></div>
    <div class="page-title"><h1>Liên hệ</h1></div>
    <section class="section contact-grid">
      <div class="box">
        <h3>Thông tin</h3>
        <p>Email: hotro@nhipstore.vn</p>
        <p>Hotline: 0900 000 000</p>
        <p>Giờ làm việc: 8:00 - 21:00 mỗi ngày</p>
      </div>
      <form class="box form" id="contactForm">
        <h3>Gửi tin nhắn</h3>
        <label>Họ tên<input required /></label>
        <label>Email<input type="email" required /></label>
        <label>Nội dung<textarea rows="4" required></textarea></label>
        <button class="btn" type="submit">Gửi</button>
        <p id="contactMsg" role="status"></p>
      </form>
    </section>
    <div id="site-footer"></div>
    <script src="script.js"></script>
  </body>
</html>
