<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sản phẩm - Nhịp Store</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Serif:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="site-header"></div>
    <div class="page-title">
      <h1>Sản phẩm</h1>
      <p>Chọn nhóm, sắp xếp hoặc tìm theo tên.</p>
    </div>
    <section class="section">
      <div class="toolbar">
        <div class="tabs" id="tabs"></div>
        <input type="search" id="search" placeholder="Tìm sản phẩm..." />
        <select id="sort">
          <option value="">Mặc định</option>
          <option value="asc">Giá tăng dần</option>
          <option value="desc">Giá giảm dần</option>
        </select>
      </div>
      <div class="grid" id="grid"></div>
    </section>
    <div id="site-footer"></div>
    <script src="script.js"></script>
  </body>
</html>
